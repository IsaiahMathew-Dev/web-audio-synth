<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Synth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="synth-container">
        <h1>Web Audio Synth</h1>
        <div class="oscillator-selector">
            <label for="oscillator-type">Oscillator Type:</label>
            <select id="oscillator-type">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>
        <div class="frequency-slider">
            <label for="frequency">Frequency:</label>
            <input type="range" id="frequency" min="20" max="20000" value="440">
            <span id="frequency-value">440</span>
        </div>
        <div class="distortion-control">
            <label for="distortion">Distortion:</label>
            <input type="range" id="distortion" min="0" max="1" value="0" step="0.01">
            <span id="distortion-value">0</span>
        </div>
        <button id="play-button">Play</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
